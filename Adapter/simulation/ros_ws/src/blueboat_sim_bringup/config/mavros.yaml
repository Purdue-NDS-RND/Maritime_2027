/**:
  ros__parameters:
    use_sim_time: false

/mavros:
  ros__parameters:
    fcu_url: udp://:14552@
    gcs_url: ""
    uas_url: /uas1
    fcu_protocol: v2.0
    system_id: 255
    component_id: 191
    target_system_id: 1
    target_component_id: 1
    plugin_allowlist: [adsb, cam_imu_sync, camera, cellular_status, command, companion_process_status, distance_sensor, esc_status, esc_telemetry, fake_gps, geofence, gimbal_control, global_position, gps_input, gps_rtk, gps_status, guided_target, home_position, imu, landing_target, local_position, log_transfer, mag_calibration_status, manual_control, mocap_pose_estimate, mount_control, nav_controller_output, obstacle_distance, obstacle_distance_3d, odometry, onboard_computer_status, open_drone_id, optical_flow, param, play_tune, rallypoint, rangefinder, rc_io, setpoint_accel, setpoint_attitude, setpoint_position, setpoint_raw, setpoint_trajectory, setpoint_velocity, sim_state, sys_status, sys_time, tdr_radio, terrain, trajectory, tunnel, vfr_hud, vision_pose, vision_speed, waypoint, wind_estimation]
    plugin_denylist: [actuator_control, altitude, debug_value, ftp, hil, px4flow, vibration, wheel_odometry]

/mavros/sys:
  ros__parameters:
    heartbeat_rate: 1.0
    heartbeat_mav_type: ONBOARD_CONTROLLER
    conn_timeout: 10.0
    disable_diag: false

/mavros/time:
  ros__parameters:
    time_ref_source: fcu
    timesync_mode: MAVLINK
    timesync_avg_alpha: 0.6
    timesync_rate: 10.0
    system_time_rate: 1.0

/mavros/local_position:
  ros__parameters:
    frame_id: map
    tf.send: false
    tf.frame_id: map
    tf.child_frame_id: base_link
    tf.send_fcu: false

/mavros/global_position:
  ros__parameters:
    frame_id: map
    child_frame_id: base_link
    tf.send: false
    tf.frame_id: map
    tf.global_frame_id: earth
    tf.child_frame_id: base_link

/mavros/imu:
  ros__parameters:
    frame_id: base_link
