# Required inputs must contain messages before a dataset can pass its checks.
# Buoy truth topics are added from the saved scenario manifest, by entity name.
required:
  - /clock
  - /sensors/camera_0/color/image_raw
  - /sensors/camera_0/depth/image_rect_raw
  - /sensors/camera_0/color/camera_info
  - /tf_static
  - /blueboat/ground_truth/tf_static
  - /mavros/state
  - /mavros/imu/data
  - /mavros/local_position/odom
  - /mavros/global_position/global
  - /blueboat/ground_truth/odometry
optional:
  - /sensors/camera_roster
  - /tf
  - /blueboat/ground_truth/tf
  - /mavros/global_position/compass_hdg
  - /mavros/time_reference
  - /mavros/timesync_status
  - /diagnostics
# Buffer one second of camera data at 30 Hz instead of inheriting shallow
# live-view queues. Source QoS and acquisition timestamps remain unchanged.
# These profiles are passed directly to rosbag2 for recording and playback.
qos:
  /clock:
    reliability: best_effort
    durability: volatile
    history: keep_last
    depth: 1000
  /sensors/camera_0/color/image_raw:
    reliability: best_effort
    durability: volatile
    history: keep_last
    depth: 30
  /sensors/camera_0/depth/image_rect_raw:
    reliability: best_effort
    durability: volatile
    history: keep_last
    depth: 30
  /sensors/camera_0/color/camera_info:
    reliability: best_effort
    durability: volatile
    history: keep_last
    depth: 30
  /tf_static:
    reliability: reliable
    durability: transient_local
    history: keep_last
    depth: 100
  /blueboat/ground_truth/tf_static:
    reliability: reliable
    durability: transient_local
    history: keep_last
    depth: 100
  /sensors/camera_roster:
    reliability: reliable
    durability: transient_local
    history: keep_last
    depth: 1
