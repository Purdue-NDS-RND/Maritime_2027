# Starting values for replay experiments; calibrate before navigation use.
/localization/buoy_mapper:
  ros__parameters:
    reference_frame: map
    body_frame: base_link
    max_pose_gap_s: 0.3
    pose_wait_s: 0.5
    max_pending_frames: 60
    costmap_extent_m: 100.0
    costmap_resolution_m: 0.1
    bearing_ekf.bearing_std_deg: 1.0
    bearing_ekf.pose_position_floor_m: 0.15
    bearing_ekf.pose_attitude_floor_deg: 1.0
    bearing_ekf.position_floor_m: 0.25
    bearing_ekf.min_baseline_m: 1.0
    bearing_ekf.min_parallax_deg: 5.0
    bearing_ekf.min_views: 4
    bearing_ekf.confirmation_updates: 3
