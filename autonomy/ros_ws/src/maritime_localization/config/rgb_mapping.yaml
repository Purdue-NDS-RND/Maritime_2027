# Starting values for replay experiments; calibrate before navigation use.
/localization/rgb_buoy_mapper:
  ros__parameters:
    reference_frame: map
    body_frame: base_link
    max_pose_gap_s: 0.3
    pose_wait_s: 0.5
    max_pending_frames: 60
    costmap_extent_m: 100.0
    costmap_resolution_m: 0.1
    rgb_mapping.bearing_std_deg: 1.0
    rgb_mapping.pose_position_floor_m: 0.15
    rgb_mapping.pose_attitude_floor_deg: 1.0
    rgb_mapping.position_floor_m: 0.25
    rgb_mapping.min_baseline_m: 1.0
    rgb_mapping.min_parallax_deg: 5.0
    rgb_mapping.min_views: 4
    rgb_mapping.confirmation_updates: 3
