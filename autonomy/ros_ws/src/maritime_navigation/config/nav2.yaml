# Simulation starting values. Physical hull is 2.2 x 1.2 m; do not add its
# radius again to the mapper's covariance/clearance envelope.
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner::SmacPlannerLattice
      tolerance: 0.3
      allow_unknown: false
      allow_reverse_expansion: false
      rotation_penalty: 5.0
      max_planning_time: 2.0
      cost_penalty: 2.0
      analytic_expansion_max_length: 6.0
      smooth_path: true
controller_server:
  ros__parameters:
    controller_frequency: 10.0
    enable_stamped_cmd_vel: false
    odom_topic: /navigation/odometry
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.0
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.3
      required_movement_angle: 0.1
      movement_time_allowance: 20.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.2
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.2
      lookahead_dist: 1.8
      use_velocity_scaled_lookahead_dist: false
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.15
      rotate_to_heading_angular_vel: 0.35
      max_angular_accel: 0.3
      allow_reversing: false
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 3.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 1.5
      regulated_linear_scaling_min_speed: 0.1
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 1.0
      cost_scaling_gain: 0.5
      inflation_cost_scaling_factor: 2.0
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 1.5
      transform_tolerance: 0.3
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /navigation/odometry
    bt_loop_duration: 100
    default_server_timeout: 2000
    wait_for_service_timeout: 1000
    navigators: [navigate_to_pose]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
# Both costmaps consume full rebuilt snapshots: no persistent ghost obstacles.
global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      resolution: 0.1
      track_unknown_space: true
      transform_tolerance: 1.0
      footprint: '[[1.1, 0.6], [1.1, -0.6], [-1.1, -0.6], [-1.1, 0.6]]'
      footprint_padding: 0.0
      always_send_full_costmap: true
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /navigation/planning_grid
        map_subscribe_transient_local: true
        subscribe_to_updates: false
        trinary_costmap: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 1.8
        cost_scaling_factor: 2.0
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      rolling_window: true
      width: 16
      height: 16
      resolution: 0.1
      update_frequency: 10.0
      publish_frequency: 2.0
      track_unknown_space: true
      transform_tolerance: 1.0
      footprint: '[[1.1, 0.6], [1.1, -0.6], [-1.1, -0.6], [-1.1, 0.6]]'
      footprint_padding: 0.0
      always_send_full_costmap: true
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /navigation/planning_grid
        map_subscribe_transient_local: true
        subscribe_to_updates: false
        trinary_costmap: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 1.8
        cost_scaling_factor: 2.0
