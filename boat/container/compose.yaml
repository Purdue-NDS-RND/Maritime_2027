name: maritime-boat
services:
  boat:
    image: ${BOAT_IMAGE:-maritime-boat:latest}
    build:
      context: ..
      dockerfile: container/Dockerfile
      args:
        MARITIME_SOURCE_REVISION: ${MARITIME_SOURCE_REVISION:-unknown}
        MARITIME_SOURCE_BRANCH: ${MARITIME_SOURCE_BRANCH:-unknown}
        MARITIME_SOURCE_DIRTY: ${MARITIME_SOURCE_DIRTY:-unknown}
    network_mode: host
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /tmp
      ROS_LOG_DIR: /logs/ros
      ROS_DOMAIN_ID: ${BOAT_ROS_DOMAIN_ID:-27}
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
    volumes:
      - ${MISSION_DIR:-../examples}:/mission:ro
      - ../../simulation/logs/boat:/logs
    command: ["python3", "-m", "boat_app.node", "--ros-args", "-p", "connection:=${BOAT_CONNECTION:-udpin:127.0.0.1:14551}"]
    stop_grace_period: 20s
