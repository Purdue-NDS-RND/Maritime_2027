name: maritime-boat
services:
  boat:
    image: ${BOAT_IMAGE:-maritime-boat:latest}
    build:
      context: ..
      dockerfile: container/Dockerfile
      args:
        MARITIME_SOURCE_REVISION: ${MARITIME_SOURCE_REVISION:-unknown}
        MARITIME_SOURCE_BRANCH: ${MARITIME_SOURCE_BRANCH:-unknown}
        MARITIME_SOURCE_DIRTY: ${MARITIME_SOURCE_DIRTY:-unknown}
    network_mode: host
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /tmp
      ROS_LOG_DIR: /logs/ros
      ROS_DOMAIN_ID: ${BOAT_ROS_DOMAIN_ID:-27}
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
    volumes:
      - ${MISSION_DIR:-../examples}:/mission:ro
      - ../../simulation/logs/boat:/logs
    command: ["python3", "-m", "boat_app.node", "--ros-args", "-p", "connection:=${BOAT_CONNECTION:?Set BOAT_CONNECTION in the selected env file}", "-p", "baud:=${BOAT_BAUD:?Set BOAT_BAUD in the selected env file}", "-p", "http_host:=${BOAT_HTTP_HOST:?Set BOAT_HTTP_HOST in the selected env file}", "-p", "http_port:=${BOAT_HTTP_PORT:?Set BOAT_HTTP_PORT in the selected env file}"]
    stop_grace_period: 20s
    healthcheck:
      # The API is constructed only after opening MAVLink. Read-only readiness
      # keeps detached startup from succeeding before serial-open failures.
      test: ["CMD", "python3", "-c", "import sys, urllib.request; host = '127.0.0.1' if sys.argv[1] == '0.0.0.0' else sys.argv[1]; urllib.request.urlopen('http://' + host + ':' + sys.argv[2] + '/status', timeout=2).close()", "${BOAT_HTTP_HOST:?Set BOAT_HTTP_HOST in the selected env file}", "${BOAT_HTTP_PORT:?Set BOAT_HTTP_PORT in the selected env file}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
