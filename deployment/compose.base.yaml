name: maritime-autonomy

services:
  autonomy:
    image: ${AUTONOMY_IMAGE:-maritime-autonomy:jazzy}
    container_name: maritime-autonomy
    build:
      context: ../autonomy
      dockerfile: container/Dockerfile
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      FCU_URL: ${FCU_URL:-}
    healthcheck:
      test: ["CMD", "bash", "-lc", "source /etc/maritime_autonomy_setup.bash && ros2 run maritime_bringup healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 9
      start_period: 15s
    restart: "no"
