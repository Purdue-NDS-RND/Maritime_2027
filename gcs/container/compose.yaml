name: maritime-course-gcs
services:
  gcs:
    image: ${GCS_IMAGE:-maritime-gcs:latest}
    build:
      context: ../..
      dockerfile: gcs/container/Dockerfile
      args:
        MARITIME_SOURCE_REVISION: ${MARITIME_SOURCE_REVISION:-unknown}
        MARITIME_SOURCE_BRANCH: ${MARITIME_SOURCE_BRANCH:-unknown}
        MARITIME_SOURCE_DIRTY: ${MARITIME_SOURCE_DIRTY:-unknown}
    network_mode: host
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      GCS_DATA: /data
      GCS_ORIGIN: ${GCS_ORIGIN:-http://localhost:8080}
      GCS_BOAT_URL: ${GCS_BOAT_URL:-http://127.0.0.1:8091}
      GCS_MAVLINK_CONNECTION: ${GCS_MAVLINK_CONNECTION:-udpin:127.0.0.1:14550}
      GCS_MAVLINK_BAUD: ${GCS_MAVLINK_BAUD:-57600}
      GCS_MAVLINK_SYSTEM_ID: ${GCS_MAVLINK_SYSTEM_ID:-1}
      GCS_MAVLINK_COMPONENT_ID: ${GCS_MAVLINK_COMPONENT_ID:-1}
    volumes:
      - ../../simulation/logs/gcs:/data
    restart: "no"
